<title>Socius Finance Logo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;600&display=swap">
<style>
/* Layout: colour picker on top, then one row per mark type: lockup on white, lockup on black, icon sizes */
:root{
  --bg:#f4f3f0; --surface:#ffffff; --fg:#111111; --muted:#5f5d58; --line:#dddad3;
  --acc:#b8893b; --acc-dark:#c99a4b;
  --font:"Jost","Futura","Century Gothic","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1a1917;--surface:#22211e;--fg:#f3efe6;--muted:#a9a59c;--line:#33312c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1917;--surface:#22211e;--fg:#f3efe6;--muted:#a9a59c;--line:#33312c;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.6;padding-inline:20px;padding-block:40px 72px}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:48px}
h1{font-weight:600;font-size:31px;margin:0 0 6px;letter-spacing:.02em;text-transform:uppercase}
header p{margin:0;color:var(--muted);max-width:64ch}
.picker{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.picker button{font:inherit;font-size:15px;display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:100px;cursor:pointer}
.picker button[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.picker button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.sw{width:26px;height:26px;border-radius:50%;display:flex;overflow:hidden;border:1px solid var(--line)}
.sw i{flex:1}
.type{display:grid;gap:14px}
.type h2{font-weight:600;font-size:20px;margin:0;letter-spacing:.03em;text-transform:uppercase}
.type h2 span{font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);font-size:15px;margin-left:10px}
.type p{margin:0;color:var(--muted);max-width:70ch}
.row{display:grid;grid-template-columns:1.25fr 1.25fr .8fr;gap:12px}
@media (max-width:820px){.row{grid-template-columns:1fr}}
.board{border-radius:6px;min-height:170px;display:flex;align-items:center;justify-content:center;padding:32px 20px;min-width:0}
.light{background:#ffffff;border:1px solid var(--line);--ink:#111111;--a:var(--acc);--paper:#ffffff}
.dark{background:#111111;--ink:#f3efe6;--a:var(--acc-dark);--paper:#111111}
.lockup{display:flex;align-items:center;gap:18px;max-width:100%}
.lockup svg{height:58px;width:auto;flex:none}
.lockup img{height:28px;width:auto;max-width:calc(100% - 90px);object-fit:contain}
.icons{gap:18px;align-items:flex-end}
.icons figure{margin:0;display:grid;justify-items:center;gap:6px}
.icons figcaption{font-size:13px;color:#5f5d58;font-variant-numeric:tabular-nums}
footer{color:var(--muted);font-size:14px;border-top:1px solid var(--line);padding-top:16px}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <clipPath id="disc" clipPathUnits="userSpaceOnUse"><circle cx="50" cy="50" r="46"/></clipPath>
    <!-- Type 1: Seal. Ring around the interlock -->
    <symbol id="m-seal" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="45" fill="none" style="stroke:var(--ink)" stroke-width="6.5"/>
      <g transform="translate(50 50) scale(.6) translate(-50 -50)" fill="none" stroke-width="11" stroke-linejoin="round">
        <path d="M78 20 H42 A15 15 0 0 0 27 35 V85" style="stroke:var(--ink)"/>
        <path d="M32 50 H57 A15 15 0 0 1 57 80 H40" style="stroke:var(--a)"/>
      </g>
    </symbol>
    <!-- Type 2: Heavy SF ligature -->
    <symbol id="m-lig" viewBox="12 10 98 82">
      <g fill="none" stroke-width="13" stroke-linecap="butt" stroke-linejoin="miter">
        <path d="M81.5 20 H38 A15 15 0 0 0 38 50 H52 A15 15 0 0 1 52 80 H18" style="stroke:var(--ink)"/>
        <path d="M106 20 H88 V86.5 M94.5 50 H106" style="stroke:var(--a)"/>
      </g>
    </symbol>
    <!-- Type 3: Tile, interlock reversed out -->
    <symbol id="m-tile" viewBox="0 0 100 100">
      <rect width="100" height="100" rx="20" style="fill:var(--ink)"/>
      <g transform="translate(50 50) scale(.66) translate(-50 -50)" fill="none" stroke-width="11" stroke-linejoin="round">
        <path d="M78 20 H42 A15 15 0 0 0 27 35 V85" style="stroke:var(--paper)"/>
        <path d="M32 50 H57 A15 15 0 0 1 57 80 H40" style="stroke:var(--tile-a,var(--a))"/>
      </g>
    </symbol>
    <!-- Type 4: Split disc, two halves joined by an S -->
    <symbol id="m-split" viewBox="0 0 100 100">
      <g clip-path="url(#disc)">
        <rect width="100" height="100" style="fill:var(--a)"/>
        <path d="M100 30 H43 A13 13 0 0 0 43 56 H57 A13 13 0 0 1 57 82 H0 V0 H100 Z" transform="translate(0 -6)" style="fill:var(--ink)"/>
        <path d="M100 30 H43 A13 13 0 0 0 43 56 H57 A13 13 0 0 1 57 82 H0" transform="translate(0 -6)" fill="none" style="stroke:var(--paper)" stroke-width="7"/>
      </g>
    </symbol>
    <!-- Previous: Interlock -->
    <symbol id="m-int" viewBox="22 15 56 70">
      <g fill="none" stroke-width="10" stroke-linejoin="round">
        <path d="M78 20 H42 A15 15 0 0 0 27 35 V85" style="stroke:var(--ink)"/>
        <path d="M32 50 H57 A15 15 0 0 1 57 80 H40" style="stroke:var(--a)"/>
      </g>
    </symbol>
  </defs>
</svg>

<div class="wrap">
<header>
  <h1>Socius Finance</h1>
  <p>Four new kinds of mark, each shown next to your black wordmark. Your name stays black in every version. Pick a colour below to see it on every mark at once.</p>
  <div class="picker" role="group" aria-label="Accent colour" id="picker"></div>
</header>
<main class="wrap" id="types" style="gap:56px"></main>
<footer id="foot"></footer>
</div>

  {id:"black",name:"All black",acc:"#111111",dark:"#f3efe6",tile:"#f3efe6"},
  {id:"emerald",name:"Black + emerald",acc:"#1f6f54",dark:"#3f9a78"},
  {id:"navy",name:"Black + navy",acc:"#1f3a68",dark:"#6f8fc4"},
  {id:"oxblood",name:"Black + oxblood",acc:"#7d2433",dark:"#c2596a"},
  {id:"stone",name:"Black + stone grey",acc:"#8a8478",dark:"#b3ada1"}
];
const types=[
  {id:"m-lig",name:"Ligature",tag:"Letters first",text:"A heavy S runs straight into the F along one top line. The stroke is as thick as the letters in your name, so the mark and wordmark read as one family."},
  {id:"m-seal",name:"Seal",tag:"Most formal",text:"The S/F monogram inside a ring. Feels like a stamp or a signet. Works well on documents, letterheads and your website footer."},
  {id:"m-tile",name:"Tile",tag:"Best for apps and social",text:"A solid block with the monogram reversed out. The strongest at small sizes: profile picture, app icon, favicon."},
  {id:"m-split",name:"Split",tag:"Most abstract",text:"A circle split in two by an S. Socius means partner: two halves that make one whole. It carries the S only, with no F, so it relies more on the name next to it."},
  {id:"m-int",name:"Interlock",tag:"Previous version, for comparison",text:"The F whose top bar and stem flow into an S."}
];
const use=(id,h)=>`<svg style="height:${h}px;width:auto" aria-hidden="true"><use href="#${id}"/></svg>`;
const wrapSvg=(id)=>{const s=document.getElementById(id).getAttribute("viewBox").split(" ").map(Number);return (h)=>`<svg viewBox="0 0 ${s[2]} ${s[3]}" style="height:${h}px;width:${(h*s[2]/s[3]).toFixed(1)}px" aria-hidden="true"><use href="#${id}"/></svg>`};
document.getElementById("types").innerHTML=types.map(t=>{const m=wrapSvg(t.id);return `
<section class="type">
  <h2>${t.name}<span>${t.tag}</span></h2>
  <p>${t.text}</p>
  <div class="row">
    <div class="board light"><div class="lockup">${m(58)}<img src="${WM_BLACK}" alt="Socius Finance"></div></div>
    <div class="board dark"><div class="lockup">${m(58)}<img src="${WM_CREAM}" alt="Socius Finance"></div></div>
    <div class="board light icons">
      <figure>${m(72)}<figcaption>large</figcaption></figure>
      <figure>${m(36)}<figcaption>36 px</figcaption></figure>
      <figure>${m(18)}<figcaption>favicon</figcaption></figure>
    </div>
  </div>
</section>`}).join("");
const root=document.documentElement, picker=document.getElementById("picker"), foot=document.getElementById("foot");
function apply(p){
  root.style.setProperty("--acc",p.acc); root.style.setProperty("--acc-dark",p.dark);
  if(p.tile) root.style.setProperty("--tile-a",p.tile); else root.style.removeProperty("--tile-a");
  picker.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.id===p.id));
  foot.textContent=`${p.name}: name and main stroke #111111, accent ${p.acc.toUpperCase()} on white, ${p.dark.toUpperCase()} on black.`;
  try{localStorage.setItem("socius-pal",p.id)}catch(e){}
}
picker.innerHTML=palettes.map(p=>`<button type="button" id="pal-${p.id}" data-id="${p.id}"><span class="sw"><i style="background:#111111"></i><i style="background:${p.acc==="#111111"?"#111111":p.acc}"></i></span>${p.name}</button>`).join("");
picker.addEventListener("click",e=>{const b=e.target.closest("button");if(b)apply(palettes.find(p=>p.id===b.dataset.id))});
let saved=null;try{saved=localStorage.getItem("socius-pal")}catch(e){}
apply(palettes.find(p=>p.id===saved)||palettes[0]);
</script>
